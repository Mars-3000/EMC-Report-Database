<div id="iosInstallHint" style="display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:9999;background:#103b66;color:white;border-radius:12px;padding:12px 14px;box-shadow:0 8px 28px #0005;font:14px/1.45 Segoe UI,Microsoft YaHei,sans-serif">
  <b>安装到 iPhone 主屏幕</b><br>请点击 Safari 的“分享”按钮，然后选择“添加到主屏幕”。
  <button id="closeIosHint" type="button" style="float:right;margin-top:6px;border:0;border-radius:6px;padding:6px 10px">知道了</button>
</div>
<script>
(function(){
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('./service-worker.js'); });
  }
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  var dismissed = localStorage.getItem('emc_ios_install_hint_dismissed') === '1';
  if (ios && !standalone && !dismissed) {
    var hint = document.getElementById('iosInstallHint');
    hint.style.display = 'block';
    document.getElementById('closeIosHint').onclick = function(){
      localStorage.setItem('emc_ios_install_hint_dismissed','1');
      hint.style.display = 'none';
    };
  }
